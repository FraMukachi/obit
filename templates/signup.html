{% extends 'base.html' %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<h2>SIGN UP</h2>
<form method="post">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Username" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit" class="ghost-btn">CREATE ACCOUNT</button>
</form>
<p style="margin-top: 20px;">Already have an account? <a href="{% url 'login' %}" style="color: #f0f0fa;">Login</a></p>
{% endblock %}
