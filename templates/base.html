<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Orbit - {% block title %}Find Your Connection{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000000;
            color: #f0f0fa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-height: 100vh;
        }
        
        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(240, 240, 250, 0.1);
        }
        
        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            text-decoration: none;
            color: #f0f0fa;
        }
        
        .nav-links a {
            color: #f0f0fa;
            text-decoration: none;
            margin-left: 20px;
            font-size: 12px;
            letter-spacing: 1px;
        }
        
        /* Main content */
        main {
            padding-top: 80px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Ghost button - only button style */
        .ghost-btn, button, .btn {
            background: rgba(240, 240, 250, 0.08);
            border: 1px solid rgba(240, 240, 250, 0.3);
            border-radius: 40px;
            padding: 14px 28px;
            color: #f0f0fa;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            font-size: 14px;
        }
        
        .ghost-btn:hover, button:hover {
            background: rgba(240, 240, 250, 0.15);
            border-color: rgba(240, 240, 250, 0.5);
        }
        
        /* Form inputs */
        input, textarea, select {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: rgba(240, 240, 250, 0.05);
            border: 1px solid rgba(240, 240, 250, 0.2);
            border-radius: 12px;
            color: #f0f0fa;
            font-family: inherit;
            font-size: 14px;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: rgba(240, 240, 250, 0.5);
        }
        
        /* Cards - just borders, no background */
        .card {
            border: 1px solid rgba(240, 240, 250, 0.15);
            border-radius: 16px;
            padding: 20px;
            margin: 15px 0;
        }
        
        /* Chat messages */
        .message {
            padding: 10px 15px;
            margin: 10px 0;
            border-radius: 20px;
            max-width: 80%;
        }
        
        .message.sent {
            background: rgba(240, 240, 250, 0.1);
            margin-left: auto;
            text-align: right;
        }
        
        .message.received {
            border: 1px solid rgba(240, 240, 250, 0.2);
        }
        
        /* Match card */
        .match-card {
            border: 1px solid rgba(240, 240, 250, 0.15);
            border-radius: 16px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        /* Section divider */
        hr {
            border-color: rgba(240, 240, 250, 0.1);
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">ORBIT</a>
        <div class="nav-links">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">DASHBOARD</a>
                <a href="{% url 'logout' %}">LOGOUT</a>
            {% else %}
                <a href="{% url 'login' %}">LOGIN</a>
                <a href="{% url 'signup' %}">SIGNUP</a>
            {% endif %}
        </div>
    </nav>
    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
